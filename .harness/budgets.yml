# Size budgets for markdown files, in estimated tokens (characters / 4).
# load = when the file is read: always (every session), on-demand (when its
# read_when matches), runtime (shipped; read when a command or stage runs).
# First matching pattern wins: list specific patterns before general ones.
# Tight on purpose. Over budget? Cut, split, or move detail out before raising a limit.
budgets:
  - {pattern: CLAUDE.md, max_tokens: 700, load: always}
  - {pattern: README.md, max_tokens: 900, load: on-demand}
  - {pattern: .harness/README.md, max_tokens: 900, load: on-demand}
  - {pattern: ".harness/workflows/*.md", max_tokens: 1000, load: on-demand}
  - {pattern: "plugin/stages/*.md", max_tokens: 500, load: runtime}
  - {pattern: "plugin/commands/*.md", max_tokens: 300, load: runtime}
  - {pattern: "plugin/skills/*/SKILL.md", max_tokens: 300, load: runtime}
  - {pattern: "plugin/templates/*.md", max_tokens: 200, load: runtime}
  - {pattern: "plugin/harness/*.md", max_tokens: 800, load: runtime}   # templates copied into consumer repos
  # This repo's own dev harness: the /run-evals agent skill.
  - {pattern: ".claude/skills/*/SKILL.md", max_tokens: 300, load: runtime}
  - {pattern: ".claude/agents/*.md", max_tokens: 500, load: runtime}
  # This repo uses its own plugin: files installed by /kairyn:init and task outputs.
  - {pattern: ".kairyn/stages/*.md", max_tokens: 500, load: runtime}
  - {pattern: ".kairyn/templates/*.md", max_tokens: 200, load: runtime}
  - {pattern: ".kairyn/learnings.md", max_tokens: 1000, load: runtime}
  - {pattern: "docs/tasks/*/*.md", max_tokens: 1500, load: runtime}
  - {pattern: "docs/backlog/*.md", max_tokens: 600, load: on-demand}
  - {pattern: "docs/adr/*.md", max_tokens: 500, load: on-demand}
  - {pattern: CHANGELOG.md, max_tokens: 2000, load: on-demand}
  # Files for outsiders: GitHub shows them; agents rarely read them.
  - {pattern: SECURITY.md, max_tokens: 200, load: on-demand}
  - {pattern: CONTRIBUTING.md, max_tokens: 250, load: on-demand}
  - {pattern: .github/pull_request_template.md, max_tokens: 100, load: on-demand}
  # Frozen test data (a v0.1.0 consumer repo for upgrade tests). Never loaded; budgeted so it stays small.
  - {pattern: "tests/fixtures/*", max_tokens: 1000, load: on-demand}
