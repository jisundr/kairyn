# AFK run settings for /kairyn:build (afk.py). Init writes this file once and never overwrites it.

# Cost caps in USD (from each session's total_cost_usd) and minutes per stage. A limit blocks the run.
limits:
  build_usd: 10
  gates_usd: 5
  review_usd: 3
  run_usd: 20
  stage_minutes: 60

# Gates run in this order; security stays last. The exit code decides. An empty command is
# "not set": never a pass. The testing gate needs a command before an AFK run can start.
gates:
  testing: uv run pytest
  contract: claude plugin validate plugin
  accessibility:
  performance:
  observability:
  security:

# Optional AI checks, one per gate, for what no command can judge. One runs only after its gate command passes.
# Example: observability: Each new code path writes a log line with the request id.
checks:

# Glob patterns for high-risk paths. Design marks a slice that touches one with (approval); build
# stops before it until you run /kairyn:build <task> approve T<n> "<words>". Examples: '**/migrations/**'.
approval:

# Regex patterns for added lines that turn off a check. afk.py lists each hit for the reviewer.
escape_hatches:
  - "# noqa"
  - "# type: ignore"
  - "eslint-disable"
  - "@ts-ignore"
  - "@ts-expect-error"
  - 'pytest\.mark\.skip'
  - '\.skip\('
  - '\bxit\('
