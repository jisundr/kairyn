name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      # Evals are excluded by default (-m 'not eval'): they call real claude and cost tokens.
      - run: uv run pytest

  consumer-python:
    # A user's machine has python3 and nothing else. Prove init and the checkers work that way.
    name: consumer install (plain python3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Init and check a fresh repo with no dependencies installed
        run: |
          repo="$(mktemp -d)"
          bash plugin/scripts/init.sh "$repo"
          bash plugin/scripts/verify-init.sh --fresh "$repo"
          python plugin/scripts/harness_docs.py --root "$repo"
          python plugin/scripts/budgets.py --root "$repo"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck plugin/scripts/*.sh scripts/*.sh
