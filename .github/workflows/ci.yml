name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked
      # Evals are excluded by default (-m 'not eval'): they call real claude and cost tokens.
      - run: uv run pytest

  consumer-python:
    # A user's machine has python3 and nothing else. Prove init and the checkers work that way.
    # 3.9 is the minimum: macOS ships it as /usr/bin/python3.
    name: consumer install (plain python3 ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # setup-python has no 3.9 build for the current ubuntu-latest; uv does. A bare venv
      # (no packages) puts that interpreter first on PATH as both python and python3.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Python ${{ matrix.python }} with nothing installed
        run: |
          uv venv --python ${{ matrix.python }} "$RUNNER_TEMP/py"
          echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"
      - name: Init and check a fresh repo with no dependencies installed
        run: |
          repo="$(mktemp -d)"
          bash plugin/scripts/init.sh "$repo"
          bash plugin/scripts/verify-init.sh --fresh "$repo"
          python plugin/scripts/harness_docs.py --root "$repo"
          python plugin/scripts/budgets.py --root "$repo"

  version-bump:
    # A change under plugin/ must ship with a newer plugin.json version, or consumers never get it.
    # Only for pull requests into main: stacked pull requests share the version of the one below.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - run: python3 scripts/check_version_bump.py "origin/${{ github.base_ref }}"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: shellcheck plugin/scripts/*.sh scripts/*.sh
