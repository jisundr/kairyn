name: Bug report
description: Something in kairyn does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For a security problem, use private vulnerability reporting instead (see SECURITY.md).
  - type: input
    id: kairyn-version
    attributes:
      label: kairyn version
      description: From `claude plugin list`.
    validations:
      required: true
  - type: input
    id: claude-code-version
    attributes:
      label: Claude Code version
      description: From `claude --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 15.5, Ubuntu 24.04, ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: The commands you ran, in order.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: What you saw, and what you expected.
      render: text
    validations:
      required: true
