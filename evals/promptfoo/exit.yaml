# depends: plugin/skills/exit/SKILL.md, plugin/stages/EXIT.md, plugin/stages/_template.md, plugin/scripts/exit.py, plugin/scripts/init.sh
description: exit stage
prompts: ["{{scenario}}"]
providers:
  - id: file://provider.py
    config: {timeout: 600000}
tests:
  - description: Exit a done task with a load-bearing decision
    vars: {scenario: exit_decision}
    metadata:
      min_pass_rate: {exits: 0.9}
    assert:
      - {type: python, value: "file://asserts.py:exits_with_adr", metric: exits}
  - description: Exit a done task with no load-bearing decision
    vars: {scenario: exit_plain}
    metadata:
      min_pass_rate: {exits: 0.9}
    assert:
      - {type: python, value: "file://asserts.py:exits_without_adr", metric: exits}
