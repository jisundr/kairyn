# depends: plugin/skills/requirements/SKILL.md, plugin/stages/REQUIREMENTS.md, plugin/stages/_template.md, plugin/stages/_approval.md, plugin/templates/STATE.md, plugin/templates/REQUIREMENTS.md, plugin/scripts/init.sh, plugin/harness/**/*
description: requirements stage
prompts: ["{{scenario}}"]
providers:
  - id: file://provider.py
    config: {timeout: 600000}
tests:
  - description: Requirements stage on a small CLI feature request
    vars: {scenario: requirements}
    metadata:
      min_pass_rate: {well_formed: 0.9, plain_language: 0.8, traceable: 0.9, specified: 0.9, waits_for_approval: 0.9}
      # Judge scores 1-5 per criterion: mean over all runs and criteria, per-criterion means, no score below floor.
      score_gate: {mean: 4, floor: 3, min_gradable: 0.9, criteria: {no_invention: 4}}
    assert:
      - {type: python, value: "file://asserts.py:well_formed", metric: well_formed}
      - {type: python, value: "file://asserts.py:quality", metric: quality}
      - {type: python, value: "file://asserts.py:plain_language", metric: plain_language}
      - {type: python, value: "file://asserts.py:traceable", metric: traceable}
      - {type: python, value: "file://asserts.py:specified", metric: specified}
      - {type: python, value: "file://asserts.py:waits_for_approval", metric: waits_for_approval}
  - description: Requirements stage on a task that grill already shaped (CONCEPT.md exists)
    vars: {scenario: requirements_with_concept}
    metadata:
      min_pass_rate: {uses_concept: 0.9, traceable: 0.9}
    assert:
      - {type: python, value: "file://asserts.py:uses_concept", metric: uses_concept}
      - {type: python, value: "file://asserts.py:traceable", metric: traceable}
  - description: Requirements stage waits for approval, ignores a reply that does not approve, then records the approval
    vars: {scenario: requirements_approval}
    metadata:
      min_pass_rate: {approval_gate: 0.9, records_approval: 0.9}
    assert:
      - {type: python, value: "file://asserts.py:approval_gate", metric: approval_gate}
      - {type: python, value: "file://asserts.py:records_approval", metric: records_approval}
