# depends: plugin/stages/GRILL.md, plugin/skills/grill/SKILL.md, plugin/stages/_template.md, plugin/templates/STATE.md, plugin/templates/CONCEPT.md, plugin/scripts/init.sh
description: grill stage
prompts: ["{{scenario}}"]
providers:
  - id: file://provider.py
    config: {timeout: 1800000}
tests:
  - description: Grill a vague, solution-first request over four turns, then stop
    vars: {scenario: grill}
    metadata:
      min_pass_rate: {well_formed: 0.9, one_question: 0.9, records_answers: 0.9, waits_for_answer: 0.9, hands_off: 0.9, plain_language: 0.8}
      score_gate: {mean: 4, floor: 3, min_gradable: 0.9, criteria: {grounded: 4, challenges: 4}}
    assert:
      - {type: python, value: "file://asserts.py:grill_well_formed", metric: well_formed}
      - {type: python, value: "file://asserts.py:one_question", metric: one_question}
      - {type: python, value: "file://asserts.py:records_answers", metric: records_answers}
      - {type: python, value: "file://asserts.py:waits_for_answer", metric: waits_for_answer}
      - {type: python, value: "file://asserts.py:hands_off", metric: hands_off}
      - {type: python, value: "file://asserts.py:plain_language", metric: plain_language}
      - {type: python, value: "file://asserts.py:grill_quality", metric: quality}
