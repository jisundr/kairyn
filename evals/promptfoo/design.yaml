# depends: plugin/skills/design/SKILL.md, plugin/stages/DESIGN.md, plugin/stages/_template.md, plugin/stages/_approval.md, plugin/templates/STATE.md, plugin/templates/DESIGN.md, plugin/templates/afk.yml, plugin/scripts/init.sh, plugin/harness/**/*
description: design stage
prompts: ["{{scenario}}"]
providers:
  - id: file://provider.py
    config: {timeout: 1800000}
tests:
  - description: Design stage on a task with approved requirements
    vars: {scenario: design}
    metadata:
      min_pass_rate: {design_well_formed: 0.9, design_traceable: 0.9, design_options: 0.9, design_grounded: 0.9, design_waits: 0.9, plain_language: 0.8, design_names_repo: 0.9}
      score_gate: {mean: 4, floor: 3, min_gradable: 0.9, criteria: {no_invention: 4}}
    assert:
      - {type: python, value: "file://asserts.py:design_well_formed", metric: design_well_formed}
      - {type: python, value: "file://asserts.py:design_traceable", metric: design_traceable}
      - {type: python, value: "file://asserts.py:design_options", metric: design_options}
      - {type: python, value: "file://asserts.py:design_grounded", metric: design_grounded}
      - {type: python, value: "file://asserts.py:design_waits", metric: design_waits}
      - {type: python, value: "file://asserts.py:design_names_repo", metric: design_names_repo}
      - {type: python, value: "file://asserts.py:plain_language", metric: plain_language}
      - {type: python, value: "file://asserts.py:design_quality", metric: quality}
  - description: Design waits for approval, ignores a reply that does not approve, rewrites for another option, then records the approval and names /kairyn:build
    vars: {scenario: design_approval}
    metadata:
      min_pass_rate: {design_approval_gate: 0.9, rewrites_option: 0.9, design_records_approval: 0.9, hands_off_build: 0.9}
    assert:
      - {type: python, value: "file://asserts.py:design_approval_gate", metric: design_approval_gate}
      - {type: python, value: "file://asserts.py:rewrites_option", metric: rewrites_option}
      - {type: python, value: "file://asserts.py:design_records_approval", metric: design_records_approval}
      - {type: python, value: "file://asserts.py:hands_off_build", metric: hands_off_build}
  - description: Design writes repo report-cli in STATE.md when the code is in that child repo
    vars: {scenario: design_child_repo, child_repo: report-cli}
    metadata:
      min_pass_rate: {design_names_repo: 0.9, design_well_formed: 0.9, design_traceable: 0.9}
    assert:
      - {type: python, value: "file://asserts.py:design_names_repo", metric: design_names_repo}
      - {type: python, value: "file://asserts.py:design_well_formed", metric: design_well_formed}
      - {type: python, value: "file://asserts.py:design_traceable", metric: design_traceable}
