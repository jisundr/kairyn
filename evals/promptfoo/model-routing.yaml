# depends: plugin/skills/model-routing/SKILL.md, plugin/stages/MODEL-ROUTING.md, plugin/stages/_template.md, plugin/templates/STATE.md, plugin/scripts/init.sh
description: model-routing stage
prompts: ["{{scenario}}"]
providers:
  - id: file://provider.py
    config: {timeout: 600000}
tests:
  - description: Model-routing stage on a feature that sends every request to one model
    vars: {scenario: model_routing}
    metadata:
      min_pass_rate: {well_formed: 0.9, starts_with_baseline: 0.9, waits_for_human: 0.9, plain_language: 0.8}
      score_gate: {mean: 4, floor: 3, min_gradable: 0.9, criteria: {no_invention: 4}}
    assert:
      - {type: python, value: "file://asserts.py:routing_well_formed", metric: well_formed}
      - {type: python, value: "file://asserts.py:starts_with_baseline", metric: starts_with_baseline}
      - {type: python, value: "file://asserts.py:waits_for_human", metric: waits_for_human}
      - {type: python, value: "file://asserts.py:plain_language", metric: plain_language}
      - {type: python, value: "file://asserts.py:routing_quality", metric: quality}
