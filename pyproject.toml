[project]
name = "kairyn-tests"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = ["pytest>=8", "pyyaml>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not probabilistic'"
markers = [
  "probabilistic: runs real `claude` sessions N times and asserts a pass rate (slow, costs tokens). Run with: pytest -m probabilistic",
]
