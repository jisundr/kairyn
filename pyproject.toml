[project]
name = "kairyn-tests"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = ["pytest>=8", "pytest-bdd>=8", "pyyaml>=6"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
pythonpath = ["tests", "evals", "plugin/scripts"]
addopts = "-m 'not eval'"
markers = [
  "eval: runs real `claude` sessions N times and asserts a pass rate (slow, costs tokens). Run with: pytest -m eval",
]
